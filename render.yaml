services:
  - type: web
    name: swethaa-resume-analyser
    runtime: python
    region: singapore
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.15
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: swethaa-portfolio-platform-db
          property: connectionString
      - key: SENTRY_DSN
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
