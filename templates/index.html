<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resume Intelligence</title><link rel="stylesheet" href="{{ url_for('static',filename='styles.css') }}"></head><body><main class="shell"><header><span class="eyebrow">NLP + HR ANALYTICS</span><h1>Resume Intelligence</h1><p>Compare multiple resumes against one job description with explainable, section-aware ranking.</p></header><section class="panel"><form id="compareForm"><div class="grid two"><label>Job title<input name="job_title" value="Data Analyst"></label><label>Resume files<input id="resumes" name="resumes" type="file" accept=".pdf,.docx,.txt" multiple required></label></div><label>Job description<textarea name="job_description" required placeholder="Paste the real job description here..."></textarea></label><label class="check"><input type="checkbox" name="use_sbert" value="true"> Use S-BERT when installed</label><button>Analyse candidates</button><p id="message"></p></form></section><section id="results" class="panel hidden"><div class="section-title"><h2>Recruiter dashboard</h2><span id="jobBadge"></span></div><div id="audit" class="audit"></div><div id="ranking"></div></section><footer>This is decision support only. Protected demographic attributes are intentionally excluded from scoring.</footer></main><script src="{{ url_for('static',filename='app.js') }}"></script></body></html>
